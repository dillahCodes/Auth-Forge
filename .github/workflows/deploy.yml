name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
  CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      # ==========================================
      # DEPLOY TO LOCAL MACHINE VIA CLOUDFLARED
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2024.6.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Deploy via Cloudflare SSH Tunnel
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
        run: |
          set -euxo pipefail

          TARGET_HOST="vps-simulator.dillahcodes.my.id"

          mkdir -p ~/.ssh

          # 1. SSH Config (menggunakan --id dan --secret, BUKAN --header)
          cat > ~/.ssh/config <<EOF
          Host ${TARGET_HOST}
            HostName ${TARGET_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h --id ${CF_CLIENT_ID} --secret ${CF_CLIENT_SECRET}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          # 2. Tulis SSH private key dengan newline akhir yang valid
          printf "%s\n" "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 3. Verifikasi validitas SSH Private Key
          echo "=== Verifikasi SSH Private Key ==="
          if ! ssh-keygen -lf ~/.ssh/deploy_key; then
            echo "❌ ERROR: SSH_PRIVATE_KEY di GitHub Secrets tidak valid! Pastikan menyalin seluruh isi key dari -----BEGIN... sampai -----END..."
            exit 1
          fi

          # 4. Deploy
          echo "=== Executing Deployment ==="
          ssh "${TARGET_HOST}" \
            "make pull PROJECTNAME=${PROJECT_NAME} USERNAME=${DOCKER_USERNAME} TAG=${IMAGE_TAG} && make start"
