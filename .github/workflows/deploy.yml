name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
  CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      - name: Setup SSH Config & Deploy
        env:
          TUNNEL_SERVICE_AUTH_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_AUTH_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          mkdir -p ~/.ssh

          # 1. Cari tahu lokasi pasti dari binary cloudflared yang baru saja di-install
          CLOUDFLARED_PATH=$(which cloudflared || echo "/usr/local/bin/cloudflared")
          echo "Lokasi cloudflared berada di: $CLOUDFLARED_PATH"

          # 2. Tulis SSH config menggunakan domain bersih
          echo "Host $CLEAN_URL" >> ~/.ssh/config

          # 4. Gunakan PATH ABSOLUT ($CLOUDFLARED_PATH) agar SSH bisa menemukannya tanpa masalah PATH env
          echo "  ProxyCommand $CLOUDFLARED_PATH access ssh --hostname %h --service-token-id $TUNNEL_SERVICE_AUTH_ID --service-token-secret $TUNNEL_SERVICE_AUTH_SECRET" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  ConnectTimeout 30" >> ~/.ssh/config

          echo "=== SSH config ==="
          cat ~/.ssh/config

          echo "=== Menjalankan deployment Auth-Forge ke mesin Ubuntu lokal ==="
          ssh ${{ env.SSH_USER }}@$CLEAN_URL \
            "make pull PROJECTNAME=${{ env.PROJECT_NAME }} USERNAME=${{ env.DOCKER_USERNAME }} TAG=${{ env.IMAGE_TAG }} && make start"
