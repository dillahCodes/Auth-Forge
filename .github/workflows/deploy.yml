name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
  CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      # ==========================================
      # DEPLOY TO LOCAL MACHINE VIA CLOUDFLARED
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2024.6.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Deploy via Cloudflare SSH Tunnel (Debug)
        shell: bash
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKER_USERNAME: ${{ env.DOCKER_USERNAME }}
        run: |
          set -euxo pipefail

          TARGET_HOST="vps-simulator.dillahcodes.my.id"

          mkdir -p ~/.ssh

          cat > ~/.ssh/config <<EOF
          Host ${TARGET_HOST}
            HostName ${TARGET_HOST}
            User ${SSH_USER}
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h --header "CF-Access-Client-Id=${CF_CLIENT_ID}" --header "CF-Access-Client-Secret=${CF_CLIENT_SECRET}"
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          printf "%s" "${SSH_PRIVATE_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo
          echo "===================="
          echo "Cloudflared Version"
          echo "===================="
          cloudflared --version

          echo
          echo "===================="
          echo "SSH Version"
          echo "===================="
          ssh -V || true

          echo
          echo "===================="
          echo "Hostname"
          echo "===================="
          echo "$TARGET_HOST"

          echo
          echo "===================="
          echo "DNS Resolve"
          echo "===================="
          getent hosts "$TARGET_HOST" || true
          nslookup "$TARGET_HOST" || true

          echo
          echo "===================="
          echo "SSH Config"
          echo "===================="
          cat ~/.ssh/config

          echo
          echo "===================="
          echo "SSH Directory"
          echo "===================="
          ls -lah ~/.ssh

          echo
          echo "===================="
          echo "Key Size"
          echo "===================="
          wc -c ~/.ssh/deploy_key

          echo
          echo "===================="
          echo "Key Header"
          echo "===================="
          head -n 2 ~/.ssh/deploy_key || true

          echo
          echo "===================="
          echo "SSH Key Fingerprint"
          echo "===================="
          ssh-keygen -lf ~/.ssh/deploy_key || true

          echo
          echo "===================="
          echo "Cloudflare Access Test"
          echo "===================="
          cloudflared access ssh \
            --hostname "$TARGET_HOST" \
            --header "CF-Access-Client-Id=${CF_CLIENT_ID}" \
            --header "CF-Access-Client-Secret=${CF_CLIENT_SECRET}" || true

          echo
          echo "===================="
          echo "SSH Connection"
          echo "===================="
          ssh -vvv "$TARGET_HOST" "echo CONNECTED"

          echo
          echo "===================="
          echo "Deploy"
          echo "===================="
          ssh "$TARGET_HOST" \
            "make pull PROJECTNAME=${PROJECT_NAME} USERNAME=${DOCKER_USERNAME} TAG=${IMAGE_TAG} && make start"
