name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
  CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      # ==========================================
      # DEPLOY TO LOCAL MACHINE VIA CLOUDFLARED
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/download/2024.6.1/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Setup SSH Config & Deploy
        run: |
          mkdir -p ~/.ssh

          CLEAN_URL=$(echo "${{ env.TUNNEL_URL }}" | sed -e 's|^https://||' -e 's|^http://||')

          # 1. Tulis SSH config (persis seperti referensi action)
          echo "Host $CLEAN_URL" >> ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" >> ~/.ssh/config

          echo "=== SSH config ==="
          cat ~/.ssh/config

          # 2. Tulis SSH private key secara manual (tidak pakai webfactory/ssh-agent)
          echo "${{ env.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 3. Populate known_hosts agar SSH tidak hang di prompt
          ssh-keyscan $CLEAN_URL >> ~/.ssh/known_hosts 2>/dev/null || true

          # 4. Test koneksi dulu (opsional, errors ditolerir)
          ssh -T -q -o StrictHostKeyChecking=no ${{ env.SSH_USER }}@$CLEAN_URL || true

          # 5. Deploy
          echo "=== Deploy ==="
          ssh -i ~/.ssh/deploy_key ${{ env.SSH_USER }}@$CLEAN_URL -p 22 \
            "make pull PROJECTNAME=${{ env.PROJECT_NAME }} USERNAME=${{ env.DOCKER_USERNAME }} TAG=${{ env.IMAGE_TAG }} && make start"
