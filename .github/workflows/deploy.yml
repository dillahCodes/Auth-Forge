name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_CLIENT_ID }}
  TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      # ==========================================
      # DEPLOY TO LOCAL MACHINE VIA CLOUDFLARED
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Configure SSH for Cloudflare Access
        run: |
          mkdir -p ~/.ssh

          # Tulis SSH private key
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          TARGET_HOST=$(echo "$TUNNEL_URL" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||' | xargs)

          # SSH Config standar resmi Cloudflare Access (ProxyCommand membaca env vars resmi TUNNEL_SERVICE_TOKEN_*)
          cat <<EOF > ~/.ssh/config
          Host $TARGET_HOST
            HostName $TARGET_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 30
            ConnectTimeout 30
          EOF

      - name: Execute Remote Deployment via SSH
        run: |
          TARGET_HOST=$(echo "$TUNNEL_URL" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/*$||' | xargs)
          ssh $TARGET_HOST "make pull PROJECTNAME=$PROJECT_NAME USERNAME=$DOCKER_USERNAME TAG=$IMAGE_TAG && make start"
