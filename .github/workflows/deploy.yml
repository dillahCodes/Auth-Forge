name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
  CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      # ==========================================
      # DEPLOY TO LOCAL MACHINE VIA CLOUDFLARED
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Inject SSH Key to Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}

      # ==========================================
      # DEBUGGING SECTION
      # ==========================================
      - name: Debug 1 - Cek Ketersediaan Secrets (Tanpa Mengekspos Isi)
        run: |
          echo "Memeriksa apakah secrets sudah terisi di repository..."
          [ -n "${{ env.TUNNEL_URL }}" ] && echo "✅ TUNNEL_URL tersedia" || echo "❌ TUNNEL_URL KOSONG"
          [ -n "${{ env.SSH_USER }}" ] && echo "✅ SSH_USER tersedia" || echo "❌ SSH_USER KOSONG"
          [ -n "${{ secrets.CF_CLIENT_ID }}" ] && echo "✅ CF_CLIENT_ID tersedia" || echo "❌ CF_CLIENT_ID KOSONG"
          [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ] && echo "✅ SSH_PRIVATE_KEY tersedia" || echo "❌ SSH_PRIVATE_KEY KOSONG"

      - name: Debug 2 - Setup SSH Config
        run: |
          mkdir -p ~/.ssh
          # Menambahkan --loglevel debug pada cloudflared
          # Menambahkan ConnectTimeout agar tidak hang selamanya jika gagal
          cat >> ~/.ssh/config << EOF
          Host ${{ env.TUNNEL_URL }}
            ProxyCommand cloudflared access ssh --loglevel debug --hostname %h
            StrictHostKeyChecking no
            ConnectTimeout 15
          EOF
          echo "Isi dari ~/.ssh/config:"
          cat ~/.ssh/config

      - name: Debug 3 - Tes Koneksi SSH (Verbose Mode)
        env:
          TUNNEL_SERVICE_AUTH_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_AUTH_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          echo "Mencoba melakukan ping SSH ke laptop lokal dengan flag -vvv..."
          # Perintah ini hanya akan mengeksekusi 'whoami' dan 'hostname' lalu langsung keluar.
          # Flag -vvv akan mencetak seluruh proses handshake SSH.
          ssh -vvv ${{ env.SSH_USER }}@${{ env.TUNNEL_URL }} "echo '✅ KONEKSI SUKSES! Terhubung sebagai user: \$(whoami) di mesin: \$(hostname)'"

      # ==========================================
      # ACTUAL DEPLOYMENT
      # ==========================================
      - name: Execute Remote Deployment
        # Step ini hanya berjalan jika 'Debug 3' berhasil
        env:
          TUNNEL_SERVICE_AUTH_ID: ${{ secrets.CF_CLIENT_ID }}
          TUNNEL_SERVICE_AUTH_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
        run: |
          echo "Mengeksekusi perintah Makefile untuk deploy Auth-Forge..."
          ssh ${{ env.SSH_USER }}@${{ env.TUNNEL_URL }} \
            "make pull PROJECTNAME=${{ env.PROJECT_NAME }} USERNAME=${{ env.DOCKER_USERNAME }} TAG=${{ env.IMAGE_TAG }} && make start"
