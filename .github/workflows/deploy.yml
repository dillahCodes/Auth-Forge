name: Deploy to Local Machine via Cloudflare

on:
  push:
    branches: ["main"]

# ==========================================
# CONFIGURATION
# ==========================================
env:
  TUNNEL_URL: ${{ secrets.TUNNEL_URL }}
  SSH_USER: ${{ secrets.SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
  CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
  PROJECT_NAME: authforge
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # BUILD & PUSH IMAGE
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build --target prod -t ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/${{ env.PROJECT_NAME }}:${{ env.IMAGE_TAG }}

      # ==========================================
      # DEPLOY TO LOCAL MACHINE VIA CLOUDFLARED
      # ==========================================
      - name: Install Cloudflared
        run: |
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          cloudflared --version

      - name: Hardcoded Test Deploy via Cloudflare SSH Tunnel
        run: |
          mkdir -p ~/.ssh

          cat << 'EOF' | sed 's/^[ \t]*//' > ~/.ssh/deploy_key
          -----BEGIN OPENSSH PRIVATE KEY-----
          b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
          QyNTUxOQAAACAMGXbkmM52fa9malw72/EPl604DCvdc0WTwOMAYpf7CwAAAKB2F5zydhec
          8gAAAAtzc2gtZWQyNTUxOQAAACAMGXbkmM52fa9malw72/EPl604DCvdc0WTwOMAYpf7Cw
          AAAEAbEJTcO8DA9o/7EUCzoAta83ZLu5hWipqoZooC/WrfngwZduSYznZ9r2ZqXDvb8Q+X
          rTgMK91zRZPA4wBil/sLAAAAGmdpdGh1YiBDSS9DRCB2cHMtc2ltdWxhdG9yAQID
          -----END OPENSSH PRIVATE KEY-----
          EOF
          chmod 600 ~/.ssh/deploy_key

          echo "=== EXECUTING HARDCODED DEPLOYMENT VIA CLOUDFLARE TUNNEL ==="
          ssh \
            -o ProxyCommand="cloudflared access tcp --hostname vps-simulator.dillahcodes.my.id --id 53a5e920bf8fbfcad8984e3745f8b68c.access --secret d259dd7f70f6c528abbc18f6cba83ef4938b114938bf6bfcc05304d398c4ae5d" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -i ~/.ssh/deploy_key \
            dillahcodes@vps-simulator.dillahcodes.my.id \
            "make pull PROJECTNAME=authforge USERNAME=dillahcodes TAG=latest && make start"
